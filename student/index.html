<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسليم الواجب | ميس شيماء ماث</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Cairo", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, #dbeafe 0%, transparent 35%),
        radial-gradient(circle at bottom left, #ede9fe 0%, transparent 35%),
        #f8fafc;
      color: #172033;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e5e7eb;
      border-radius: 25px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.10);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(79, 70, 229, 0.25);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 6px;
    }

    .header p {
      color: #64748b;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    input,
    select {
      width: 100%;
      height: 52px;
      border: 1px solid #dbe0e8;
      border-radius: 13px;
      padding: 0 15px;
      font-family: inherit;
      font-size: 14px;
      background: #fff;
      color: #172033;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
    }

    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 17px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.25s;
      background: #f8fafc;
    }

    .upload-area:hover {
      border-color: #6366f1;
      background: #f5f5ff;
    }

    .upload-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .upload-area h3 {
      font-size: 16px;
      color: #334155;
      margin-bottom: 5px;
    }

    .upload-area p {
      font-size: 12px;
      color: #94a3b8;
    }

    #files {
      display: none;
    }

    .file-list {
      margin-top: 15px;
      display: none;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      padding: 10px 13px;
      border-radius: 11px;
      margin-bottom: 8px;
    }

    .file-name {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      color: #94a3b8;
      font-size: 11px;
      white-space: nowrap;
    }

    .submit-btn {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 14px;
      margin-top: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.20);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(79, 70, 229, 0.28);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 25px 18px;
        border-radius: 20px;
      }

      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="header">
        <div class="logo">م</div>

        <h1>ميس شيماء ماث</h1>

        <p>
          قم بإرسال الواجب الخاص بك من هنا
        </p>
      </div>

      <form id="homeworkForm">

        <div class="form-group">
          <label for="studentName">
            اسم الطالب
          </label>

          <input type="text" id="studentName" name="studentName" placeholder="اكتب اسمك بالكامل" required>
        </div>

        <div class="form-group">

          <label for="stage">
            المرحلة الدراسية
          </label>

          <select id="stage" name="stage" required>

            <option value="">
              اختر المرحلة
            </option>

            <option value="الصف الرابع الابتدائي">
              الصف الرابع الابتدائي
            </option>

            <option value="الصف الخامس الابتدائي">
              الصف الخامس الابتدائي
            </option>

            <option value="الصف السادس الابتدائي">
              الصف السادس الابتدائي
            </option>

            <option value="الصف الأول الإعدادي">
              الصف الأول الإعدادي
            </option>

            <option value="الصف الثاني الإعدادي">
              الصف الثاني الإعدادي
            </option>

            <option value="الصف الثالث الإعدادي">
              الصف الثالث الإعدادي
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>
            ملفات الواجب
          </label>

          <label class="upload-area" for="files">

            <div class="upload-icon">
              📚
            </div>

            <h3>
              اضغط هنا لاختيار ملفات الواجب
            </h3>

            <p>
              يمكنك اختيار أكثر من ملف
            </p>

          </label>

          <input type="file" id="files" name="files" multiple>

          <div id="fileList" class="file-list"></div>

        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          إرسال الواجب
        </button>

      </form>

      <div id="successMessage" class="message success">
        تم إرسال الواجب بنجاح ✅
      </div>

      <div id="errorMessage" class="message error">
        حدث خطأ أثناء إرسال الواجب ❌
      </div>

    </div>

    <div class="footer">
      ميس شيماء ماث © 2026
    </div>

  </div>


  <script>

    // ==========================================
    // رابط الـ Backend
    // ==========================================

    const API_URL =
      "https://crispy-space-barnacle-g4r5j4qjxx5gf9v55-3000.app.github.dev";


    // ==========================================
    // العناصر
    // ==========================================

    const form =
      document.getElementById("homeworkForm");

    const filesInput =
      document.getElementById("files");

    const fileList =
      document.getElementById("fileList");

    const submitBtn =
      document.getElementById("submitBtn");

    const successMessage =
      document.getElementById("successMessage");

    const errorMessage =
      document.getElementById("errorMessage");


    // ==========================================
    // عرض الملفات المختارة
    // ==========================================

    filesInput.addEventListener("change", function () {

      fileList.innerHTML = "";

      if (filesInput.files.length === 0) {

        fileList.style.display = "none";

        return;
      }

      fileList.style.display = "block";

      Array.from(filesInput.files).forEach(function (file) {

        const item =
          document.createElement("div");

        item.className = "file-item";


        const name =
          document.createElement("div");

        name.className = "file-name";

        name.textContent = file.name;


        const size =
          document.createElement("div");

        size.className = "file-size";

        size.textContent =
          formatFileSize(file.size);


        item.appendChild(name);

        item.appendChild(size);

        fileList.appendChild(item);

      });

    });


    // ==========================================
    // تحويل حجم الملف
    // ==========================================

    function formatFileSize(bytes) {

      if (bytes < 1024) {
        return bytes + " B";
      }

      if (bytes < 1024 * 1024) {

        return (
          bytes / 1024
        ).toFixed(1) + " KB";

      }

      return (
        bytes / (1024 * 1024)
      ).toFixed(1) + " MB";

    }


    // ==========================================
    // إخفاء الرسائل
    // ==========================================

    function hideMessages() {

      successMessage.style.display = "none";

      errorMessage.style.display = "none";

    }


    // ==========================================
    // إرسال الواجب
    // ==========================================

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        hideMessages();


        const studentName =
          document
            .getElementById("studentName")
            .value
            .trim();


        const stage =
          document.getElementById("stage").value;


        // التحقق من الاسم

        if (!studentName) {

          errorMessage.textContent =
            "من فضلك اكتب اسم الطالب";

          errorMessage.style.display =
            "block";

          return;
        }


        // التحقق من المرحلة

        if (!stage) {

          errorMessage.textContent =
            "من فضلك اختر المرحلة الدراسية";

          errorMessage.style.display =
            "block";

          return;
        }


        // التحقق من الملفات

        if (filesInput.files.length === 0) {

          errorMessage.textContent =
            "من فضلك اختر ملف واحد على الأقل";

          errorMessage.style.display =
            "block";

          return;
        }


        // منع الضغط أثناء الرفع

        submitBtn.disabled = true;

        submitBtn.textContent =
          "جاري إرسال الواجب...";


        try {

          const formData =
            new FormData();


          // بيانات الطالب

          formData.append(
            "studentName",
            studentName
          );

          formData.append(
            "stage",
            stage
          );


          // إضافة كل الملفات

          Array.from(filesInput.files).forEach(
            function (file) {

              formData.append(
                "files",
                file
              );

            }
          );


          // إرسال البيانات إلى Backend

          const response =
            await fetch(
              `${API_URL}/upload`,
              {
                method: "POST",
                body: formData
              }
            );


          const data =
            await response.json();


          if (!response.ok || !data.success) {

            throw new Error(
              data.message ||
              "حدث خطأ أثناء إرسال الواجب"
            );

          }


          // نجاح

          successMessage.textContent =
            "تم إرسال الواجب بنجاح ✅";

          successMessage.style.display =
            "block";


          // تفريغ الفورم

          form.reset();

          fileList.innerHTML = "";

          fileList.style.display =
            "none";


        } catch (error) {

          console.error(
            "Upload error:",
            error
          );

          errorMessage.textContent =
            "تعذر إرسال الواجب. تأكد من اتصال السيرفر ثم حاول مرة أخرى.";

          errorMessage.style.display =
            "block";

        } finally {

          submitBtn.disabled = false;

          submitBtn.textContent =
            "إرسال الواجب";

        }

      }
    );

  </script>

</body>

</html>
